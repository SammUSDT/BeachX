<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BEACHX — Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0a0a12;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px;transition:background .4s}
:root{--p:#00d4ff;--c:#111118;--b:#1a1a2a;--d:#555;--dd:#333}
.lc{display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;max-width:400px;text-align:center}
.logo{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#0a1a2a,#1a2a4a);display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:20px;border:2px solid rgba(0,212,255,.1)}
.brand{font-size:32px;font-weight:800;letter-spacing:6px;background:linear-gradient(135deg,#00d4ff,#0088cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.bsub{font-size:11px;color:var(--dd);letter-spacing:4px;margin-bottom:40px}
.card{background:var(--c);border-radius:20px;padding:24px 20px;width:100%;border:1px solid var(--b)}
.ct{font-size:22px;font-weight:700;margin-bottom:4px;text-align:left}
.cs{font-size:13px;color:var(--d);margin-bottom:24px;text-align:left}
.ig{display:flex;align-items:center;background:#0d0d15;border:1px solid var(--b);border-radius:12px;padding:12px 16px;margin-bottom:12px;transition:.3s}
.ig:focus-within{border-color:var(--p)}
.ig .ic{font-size:18px;margin-right:12px;color:var(--dd)}
.ig input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:14px}
.ig input::placeholder{color:var(--dd)}
.tp{cursor:pointer;color:var(--dd);font-size:16px}
.btn{width:100%;padding:16px;border-radius:12px;border:1px solid var(--p);background:transparent;color:var(--p);font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:.3s;margin-top:8px}
.btn:hover,.btn:active{background:var(--p);color:#000}
.tm{display:flex;gap:8px;justify-content:center;margin-top:20px}
.td{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.3s}
.td:hover,.td.active{border-color:#fff;transform:scale(1.1)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,212,255,.9);color:#000;padding:12px 24px;border-radius:60px;font-size:13px;font-weight:600;display:none;z-index:300}
.toast.show{display:block}
</style>
</head>
<body>

<div class="lc">
<div class="logo">🐺</div>
<div class="brand">BEACHX</div>
<div class="bsub">SILAHKAN LOGIN</div>

<div class="card">
<div class="ct">Welcome back</div>
<div class="cs">Masukkan Akunmu</div>

<div class="ig">
<span class="ic">👤</span>
<input type="text" id="username" placeholder="Username" autocomplete="off">
</div>

<div class="ig">
<span class="ic">🔒</span>
<input type="password" id="password" placeholder="Password">
<span class="tp" onclick="togglePass()">👁</span>
</div>

<button class="btn" onclick="doLogin()">SIGN IN →</button>
</div>

<div class="tm">
<div class="td active" style="background:#00d4ff" onclick="setTheme('blue',this)"></div>
<div class="td" style="background:#ef4444" onclick="setTheme('red',this)"></div>
<div class="td" style="background:#4ade80" onclick="setTheme('green',this)"></div>
<div class="td" style="background:#a855f7" onclick="setTheme('purple',this)"></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
var themes={
blue:{p:'#00d4ff',bg:'#0a0a12',c:'#111118'},
red:{p:'#ef4444',bg:'#120a0a',c:'#181111'},
green:{p:'#4ade80',bg:'#0a120a',c:'#111811'},
purple:{p:'#a855f7',bg:'#0f0a12',c:'#151118'}
};

function setTheme(n,el){
var t=themes[n];
document.documentElement.style.setProperty('--p',t.p);
document.documentElement.style.setProperty('--c',t.c);
document.body.style.background=t.bg;
document.querySelectorAll('.td').forEach(function(d){d.classList.remove('active')});
if(el)el.classList.add('active');
localStorage.setItem('beachx_theme',n);
showToast('Tema: '+n);
}

function togglePass(){
var p=document.getElementById('password');
p.type=p.type==='password'?'text':'password';
}

function doLogin(){
var u=document.getElementById('username').value.trim();
var p=document.getElementById('password').value.trim();
if(!u||!p){showToast('Isi username & password!');return}
localStorage.setItem('beachx_user',u);
localStorage.setItem('beachx_logged','true');
showToast('Selamat datang, '+u+'!');
setTimeout(function(){window.location.href='index.html'},800);
}

function showToast(m){
var el=document.getElementById('toast');
el.textContent=m;el.classList.add('show');
clearTimeout(el._t);
el._t=setTimeout(function(){el.classList.remove('show')},2500);
}

var saved=localStorage.getItem('beachx_theme')||'blue';
var t2=themes[saved];
if(t2){
document.documentElement.style.setProperty('--p',t2.p);
document.documentElement.style.setProperty('--c',t2.c);
document.body.style.background=t2.bg;
}
</script>
</body>
</html>

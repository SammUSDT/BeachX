<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BEACHX — Manage Accounts</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#05060a;color:#fff;min-height:100vh;padding:20px;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;top:-20%;left:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(0,212,255,.06),transparent 70%);border-radius:50%;pointer-events:none}
:root{--p:#00d4ff;--c:rgba(17,17,24,.7);--b:rgba(255,255,255,.06);--d:#666;--dd:#333}
.h{text-align:center;margin-bottom:24px}
.h h1{font-size:28px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#00d4ff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.h p{font-size:10px;color:var(--dd);letter-spacing:3px;margin-top:4px;text-transform:uppercase}
.card{background:var(--c);backdrop-filter:blur(30px);border-radius:24px;padding:24px 20px;border:1px solid var(--b);margin-bottom:16px}
.ct{font-size:18px;font-weight:700;margin-bottom:4px}
.cs{font-size:12px;color:var(--d);margin-bottom:20px}
.acc-item{background:rgba(0,0,0,.3);border:1px solid var(--b);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.acc-item .info{text-align:left;flex:1;min-width:0}
.acc-item .info .name{font-size:14px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px}
.acc-item .info .name .role{font-size:9px;padding:2px 8px;border-radius:20px;background:rgba(245,158,11,.1);color:#f59e0b;border:1px solid rgba(245,158,11,.2)}
.acc-item .info .meta{font-size:11px;color:var(--d);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.acc-item .info .meta .timer{color:#4ade80}
.acc-item .info .meta .timer.warn{color:#f59e0b}
.acc-item .info .meta .timer.danger{color:#ef4444}
.acc-item .info .meta .permanent{color:#00d4ff}
.acc-item .actions{display:flex;gap:6px;flex-shrink:0}
.btn-small{padding:8px 14px;font-size:11px;font-weight:700;border-radius:10px;border:none;cursor:pointer;background:#ef4444;color:#fff;transition:.3s}
.btn-small:hover{transform:scale(1.05)}
.btn-back{width:100%;padding:14px;border-radius:14px;border:1px solid var(--b);background:transparent;color:var(--d);font-size:13px;cursor:pointer;transition:.3s;margin-top:16px}
.btn-back:hover{color:#fff;border-color:var(--p)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,212,255,.95);color:#000;padding:14px 28px;border-radius:60px;font-size:13px;font-weight:600;display:none;z-index:300;box-shadow:0 10px 40px rgba(0,212,255,.3);max-width:90%;text-align:center}
.toast.show{display:block;animation:toastIn .3s ease}
.toast.error{background:rgba(239,68,68,.95);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>

<div class="h">
<h1>🔐 Manage Accounts</h1>
<p>Developer Panel</p>
</div>

<div class="card">
<div class="ct">Daftar Akun</div>
<div class="cs">Kelola semua akun</div>
<div id="accountList"></div>
<button class="btn-back" onclick="window.location.href='account.html'">← Kembali ke Login</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================
   AKUN HARDCODED — EDIT MANUAL DI SINI
   ============================================ */
var DEFAULT_ACCOUNTS = {
  "DevOffc": {
    password: "DevOffc123",
    role: "developer",
    permanent: true
  },
  "Hallowz": {
    password: "Hallowz1",
    role: "user",
    permanent: true
  },
  "user2": {
    password: "pass456",
    role: "user",
    permanent: false,
    expiresAt: 1798761600000,
    days: 30
  },
  "user3": {
    password: "pass789",
    role: "user",
    permanent: true
  }
};

var ACCOUNTS_KEY = 'beachx_accounts';

function getAccounts(){
var local = {};
try{local = JSON.parse(localStorage.getItem(ACCOUNTS_KEY)) || {};}catch(e){}
var merged = {};
Object.keys(DEFAULT_ACCOUNTS).forEach(function(k){ merged[k] = DEFAULT_ACCOUNTS[k]; });
Object.keys(local).forEach(function(k){ merged[k] = local[k]; });
return merged;
}

function saveAccounts(acc){
var local = {};
try{local = JSON.parse(localStorage.getItem(ACCOUNTS_KEY)) || {};}catch(e){}
Object.keys(acc).forEach(function(k){ local[k] = acc[k]; });
localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(local));
}

function checkExpired(){
var acc = getAccounts();
var now = Date.now();
var changed = false;
Object.keys(acc).forEach(function(k){
if(acc[k].role === 'developer') return;
if(acc[k].permanent) return;
if(acc[k].expiresAt && now > acc[k].expiresAt){
delete acc[k];
changed = true;
}
});
if(changed) saveAccounts(acc);
return changed;
}

function killAccount(username){
if(!confirm('Yakin mau hapus akun "'+username+'"?'))return;
var acc = getAccounts();
if(acc[username] && acc[username].role === 'developer'){
showToast('❌ Tidak bisa hapus akun developer!',true);
return;
}
delete acc[username];
saveAccounts(acc);
showToast('🗑️ Akun '+username+' dihapus!');
renderAccounts();
}

function renderAccounts(){
checkExpired();
var acc = getAccounts();
var list = document.getElementById('accountList');
var keys = Object.keys(acc);

if(keys.length === 0){
list.innerHTML = '<div style="color:var(--dd);text-align:center;padding:20px;font-size:12px">Belum ada akun</div>';
return;
}

var html = '';
keys.forEach(function(k){
var a = acc[k];
var isDev = a.role === 'developer';
var roleTag = isDev ? '<span class="role">DEV</span>' : '';
var timerInfo = '';

if(isDev || a.permanent){
timerInfo = '<span class="permanent">♾️ Permanent</span>';
}else if(a.expiresAt){
var left = a.expiresAt - Date.now();
var daysLeft = Math.ceil(left / (24*60*60*1000));
var cls = 'timer';
if(daysLeft <= 1) cls = 'timer danger';
else if(daysLeft <= 3) cls = 'timer warn';
timerInfo = '<span class="'+cls+'">⏱️ '+daysLeft+' hari lagi</span>';
}

var killBtn = isDev ? '' : '<button class="btn-small" onclick="killAccount(\''+k+'\')">KILL</button>';

html += '<div class="acc-item">'+
'<div class="info">'+
'<div class="name">'+k+roleTag+'</div>'+
'<div class="meta">'+
'<span>🔑 '+a.password+'</span>'+
timerInfo+
'</div>'+
'</div>'+
'<div class="actions">'+killBtn+'</div>'+
'</div>';
});

list.innerHTML = html;
}

function showToast(m, err){
var el=document.getElementById('toast');
el.textContent=m;
el.className = 'toast show' + (err?' error':'');
clearTimeout(el._t);
el._t=setTimeout(function(){el.classList.remove('show')},2800);
}

renderAccounts();
setInterval(function(){ checkExpired(); renderAccounts(); }, 30000);
</script>
</body>
</html>
